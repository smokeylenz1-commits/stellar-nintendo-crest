name: iPredict CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Daily TLS certificate expiry check (06:00 UTC)
    - cron: '0 6 * * *'
    # Daily PostgreSQL base backup + WAL archive (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # ── Job 1: Frontend lint, test, and build ──────────────────────────────────
  lint-test-build:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 7

  # ── Job 2: Rust contract check, lint, format & test ────────────────────────
  contract-check:
    name: Contracts (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32v1-none
          components: clippy, rustfmt

      - name: Cache Cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        working-directory: contracts
        run: cargo audit

      - name: Check formatting
        working-directory: contracts
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: contracts
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check workspace compiles
        working-directory: contracts
        run: cargo check --workspace

      - name: Run contract tests
        working-directory: contracts
        run: cargo test --workspace

  # ── Job 3: Node packages (backend, indexer, oracle) ────────────────────────
  node-packages:
    name: ${{ matrix.package }} (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, indexer, oracle]
        node-version: [18, 20]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ipredict_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ipredict_test
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Audit dependencies
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: ${{ matrix.package }}
        run: npm run typecheck

      - name: Run DB migrations
        if: matrix.package == 'backend' || matrix.package == 'indexer'
        working-directory: db
        run: npm run migrate

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: npm test

  # ── Job 4: Database migration linting ──────────────────────────────────────
  db-migrations:
    name: DB (migration lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: db/package-lock.json

      - name: Install dependencies
        working-directory: db
        run: npm ci

      - name: Audit dependencies
        working-directory: db
        run: npm audit --audit-level=high

      - name: Lint migrations
        working-directory: db
        run: npm run lint:migrations

  # ── Job 5: Snyk vulnerability scanning ─────────────────────────────────────
  snyk-scan:
    name: Snyk vulnerability scan (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    # Block PR merges when high/critical CVEs are found.
    # Set continue-on-error: true if you want informational-only scans.
    continue-on-error: false
    permissions:
      contents: read
      security-events: write  # for uploading SARIF results to GitHub Security tab

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: frontend
            path: frontend
            type: npm
          - name: backend
            path: backend
            type: npm
          - name: indexer
            path: indexer
            type: npm
          - name: oracle
            path: oracle
            type: npm
          - name: db
            path: db
            type: npm
          - name: contracts
            path: contracts
            type: cargo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ── npm targets: install deps so Snyk can resolve the full tree ─────────
      - name: Setup Node.js
        if: matrix.target.type == 'npm'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.target.path }}/package-lock.json

      - name: Install npm dependencies
        if: matrix.target.type == 'npm'
        working-directory: ${{ matrix.target.path }}
        run: npm ci

      # ── Rust target: install toolchain so Snyk can parse Cargo.lock ─────────
      - name: Install Rust toolchain
        if: matrix.target.type == 'cargo'
        uses: dtolnay/rust-toolchain@stable

      # ── Snyk scan ────────────────────────────────────────────────────────────
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        if: matrix.target.type == 'npm'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >-
            --severity-threshold=high
            --file=${{ matrix.target.path }}/package.json
            --sarif-file-output=snyk-${{ matrix.target.name }}.sarif

      - name: Run Snyk to check Rust dependencies
        uses: snyk/actions/rust@master
        if: matrix.target.type == 'cargo'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >-
            --severity-threshold=high
            --file=contracts/Cargo.toml
            --sarif-file-output=snyk-${{ matrix.target.name }}.sarif

      # ── Upload SARIF to GitHub Security tab ──────────────────────────────────
      - name: Upload Snyk SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-${{ matrix.target.name }}.sarif

      # ── Attach audit log to workflow summary ─────────────────────────────────
      - name: Generate and attach audit log
        if: always()
        run: |
          SARIF="snyk-${{ matrix.target.name }}.sarif"
          SUMMARY="snyk-audit-${{ matrix.target.name }}.md"

          echo "## Snyk audit: ${{ matrix.target.name }}" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "| Field | Value |" >> "$SUMMARY"
          echo "|---|---|" >> "$SUMMARY"
          echo "| Target | \`${{ matrix.target.path }}\` |" >> "$SUMMARY"
          echo "| Severity threshold | high + critical |" >> "$SUMMARY"
          echo "| Scan time | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          if [[ -f "$SARIF" ]]; then
            VULN_COUNT=$(python3 -c "
          import json, sys
          data = json.load(open('$SARIF'))
          count = sum(len(r.get('results', [])) for r in data.get('runs', []))
          print(count)
          " 2>/dev/null || echo "unknown")
            echo "| Findings | $VULN_COUNT |" >> "$SUMMARY"
          else
            echo "| Findings | SARIF not generated (scan may have failed) |" >> "$SUMMARY"
          fi

          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit log artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snyk-audit-${{ matrix.target.name }}
          path: snyk-audit-${{ matrix.target.name }}.md
          retention-days: 30
