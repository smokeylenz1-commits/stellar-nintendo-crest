name: Secret Rotation

on:
  # Run weekly on Monday at 01:00 UTC (off-peak, before the daily DB backup at 02:00)
  schedule:
    - cron: '0 1 * * 1'
  # Allow manual trigger from the Actions tab with target selection
  workflow_dispatch:
    inputs:
      target:
        description: 'Rotation target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - db
          - relayer
      dry_run:
        description: 'Dry run (no changes made)'
        required: false
        default: 'false'
        type: boolean
      restart_ecs:
        description: 'Trigger ECS rolling restart after rotation'
        required: false
        default: 'true'
        type: boolean
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write  # required for OIDC AWS authentication

jobs:
  rotate:
    name: Rotate secrets (${{ github.event.inputs.target || 'all' }}, ${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ── AWS authentication via OIDC (no long-lived access keys) ─────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      # ── Node.js setup ────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # ── Build rotation target flags ──────────────────────────────────────────
      - name: Set rotation flags
        id: flags
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          RESTART_ECS="${{ github.event.inputs.restart_ecs || 'true' }}"

          ARGS="--target=$TARGET"
          [[ "$DRY_RUN" == "true" ]] && ARGS="$ARGS --dry-run"
          [[ "$RESTART_ECS" == "true" ]] && ARGS="$ARGS --restart-ecs"

          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Rotation args: $ARGS"

      # ── Run the rotation script ──────────────────────────────────────────────
      - name: Rotate secrets
        working-directory: backend
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          DB_SECRET_ARN: ${{ secrets.DB_SECRET_ARN }}
          RELAYER_SECRET_ARN: ${{ secrets.RELAYER_SECRET_ARN }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          DB_DRAIN_MS: '30000'
          RELAYER_GRACE_MS: '60000'
        run: |
          npx ts-node scripts/rotate-secrets.ts ${{ steps.flags.outputs.args }}

      # ── Post-rotation verification ───────────────────────────────────────────
      - name: Verify Secrets Manager version updated
        if: github.event.inputs.dry_run != 'true'
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          DB_SECRET_ARN: ${{ secrets.DB_SECRET_ARN }}
          RELAYER_SECRET_ARN: ${{ secrets.RELAYER_SECRET_ARN }}
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"
          ROTATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "## Secret Rotation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ github.event.inputs.environment || 'staging' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | $TARGET |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rotated at | $ROTATED_AT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$TARGET" == "db" || "$TARGET" == "all" ]]; then
            DB_VERSION=$(aws secretsmanager describe-secret \
              --secret-id "$DB_SECRET_ARN" \
              --query 'LastChangedDate' \
              --output text 2>/dev/null || echo "unknown")
            echo "| DB secret last changed | $DB_VERSION |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$TARGET" == "relayer" || "$TARGET" == "all" ]]; then
            RELAYER_VERSION=$(aws secretsmanager describe-secret \
              --secret-id "$RELAYER_SECRET_ARN" \
              --query 'LastChangedDate' \
              --output text 2>/dev/null || echo "unknown")
            echo "| Relayer secret last changed | $RELAYER_VERSION |" >> "$GITHUB_STEP_SUMMARY"
          fi
