version: 2
updates:
  # ── Rust / Cargo (contracts) ───────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"

  # ── npm: frontend (Next.js) ────────────────────────────────────────────────
  - package-ecosystem: "npm"
