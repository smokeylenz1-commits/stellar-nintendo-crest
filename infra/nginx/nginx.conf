################################################################################
# iPredict – Nginx main configuration
#
# Reverse-proxy layout:
#   /api/*          → backend Node.js service (port 3001)
#   /ws             → WebSocket upgrade to backend
#   /               → Next.js frontend (port 3000)
#
# Features:
#   • HTTP/2 on port 443 with TLS 1.2/1.3
#   • HSTS, CSP, and other security headers (A+ SSL Labs target)
#   • gzip compression for text assets
#   • Rate limiting on /api to 60 req/min per IP
#   • Automatic HTTP → HTTPS redirect on port 80
#   • Let's Encrypt / Certbot webroot challenge path at /.well-known/acme-challenge
################################################################################

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept       on;
    use                epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # 60 requests per minute per IP on /api
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_status 429;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream backend {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    upstream frontend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # ── Include virtual hosts ─────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
